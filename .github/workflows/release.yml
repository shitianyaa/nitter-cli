# Release: tag-triggered build matrix + draft GitHub Release, behind a
# release-source trust chain and a human approval gate.
#
# Trust model (ported from FlanChanXwO/javdb-cli, MIT): the tag must resolve to
# a commit that is an ancestor of the protected default branch, so a tag cut
# from any other history cannot drive a release; the final publication job runs
# only after an explicit approval on the release-approval environment, and the
# secrets-bearing publication runs in the isolated release environment. The
# draft Release stays a draft, so publishing it to the public remains a manual,
# version-specific act.
#
# Runner matrix choices (2026-09): ubuntu-24.04 / ubuntu-24.04-arm,
# macos-15-intel + macos-15 (ARM), windows-2025 + windows-11-arm (free for
# public repos).
#
# Action pins: commit SHAs (same policy as ci.yml).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable stable SemVer tag to publish
        required: true
        type: string

# Tag push and manual recovery both pick the release tag here; every later
# job binds checkout, version and Release to this value.
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

permissions: {}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate the SemVer tag (vMAJOR.MINOR.PATCH[-prerelease][+build])
        run: |
          if ! echo "${RELEASE_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag ${RELEASE_TAG} is not strict SemVer with a v prefix"
            exit 1
          fi

      - name: Require the tag commit on the default release branch
        id: trust
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          go run ./tools/release verify-source --tag "$RELEASE_TAG" --default-branch "$DEFAULT_BRANCH" --github-output "$GITHUB_OUTPUT"

      - name: Require bilingual changelog notes for the release
        run: |
          version="${RELEASE_TAG#v}"
          missing=0
          for lang in en zh-CN; do
            if [ ! -s "changelog/v${version}/${lang}.md" ]; then
              echo "::error::changelog/v${version}/${lang}.md is missing or empty — move the bilingual notes out of changelog/unreleased before tagging"
              missing=1
            fi
          done
          exit "$missing"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, target: darwin-amd64, archive: tar.gz }
          - { os: macos-15, target: darwin-arm64, archive: tar.gz }
          - { os: ubuntu-24.04, target: linux-amd64, archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: linux-arm64, archive: tar.gz }
          - { os: windows-2025, target: windows-amd64, archive: zip }
          - { os: windows-11-arm, target: windows-arm64, archive: zip }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: go test
        run: go test ./... -count=1
      - name: build
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          commit="$(git rev-parse --short HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          case "${{ matrix.os }}" in
            windows-*) ext=".exe" ;;
            *) ext="" ;;
          esac
          mkdir -p "dist/${{ matrix.target }}"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X github.com/shitianyaa/nitter-cli/internal/buildinfo.Version=${version} \
            -X github.com/shitianyaa/nitter-cli/internal/buildinfo.Commit=${commit} \
            -X github.com/shitianyaa/nitter-cli/internal/buildinfo.BuildDate=${build_date}" \
            -o "dist/${{ matrix.target }}/nitter${ext}" ./cmd/nitter
      - name: package (tar.gz on unix, zip on windows) + sha256
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          target="${{ matrix.target }}"
          cd "dist/${target}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            powershell.exe -NoProfile -Command "Compress-Archive -Path 'nitter.exe' -DestinationPath '../nitter-${version}-${target}.zip'"
          else
            tar -czf "../nitter-${version}-${target}.tar.gz" nitter
          fi
          cd ..
          if [ "${{ matrix.archive }}" = "zip" ]; then
            sha256sum "nitter-${version}-${target}.zip" > "checksums-${target}.txt"
          else
            sha256sum "nitter-${version}-${target}.tar.gz" > "checksums-${target}.txt"
          fi
      - name: upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/nitter-*
            dist/checksums-*.txt

  approve_release:
    name: Approve final release publication
    needs: build
    runs-on: ubuntu-24.04
    environment: release-approval
    permissions: {}
    steps:
      - name: Record final release approval
        shell: bash
        run: 'true'

  release:
    name: Prepare the draft GitHub Release
    needs: [build, approve_release]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          merge-multiple: true
      - name: merge per-platform checksums into checksums.txt
        run: |
          cat dist/checksums-*.txt >> dist/checksums.txt
          rm dist/checksums-*.txt
          cat dist/checksums.txt
      - name: create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # The release job downloads artifacts and never checks out the
          # repository, so gh has no git remote to resolve the repo from;
          # GH_REPO gives it the owner/name context directly.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --draft \
            --title "nitter-cli ${RELEASE_TAG}" \
            --generate-notes \
            dist/nitter-* dist/checksums.txt
